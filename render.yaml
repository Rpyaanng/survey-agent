# Render Blueprint: managed Postgres + Redis (Key Value), Flask API and Next.js web app.
# Fill the sync:false secrets in the Render dashboard after the first deploy.
databases:
  - name: survey-agent-db
    plan: basic-256mb
    databaseName: survey_agent

services:
  - type: keyvalue
    name: survey-agent-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: survey-agent-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: survey-agent-db, property: connectionString }
      - key: RATELIMIT_STORAGE_URI
        fromService: { type: keyvalue, name: survey-agent-redis, property: connectionString }
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_TEAM
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      - key: ELEVENLABS_PHONE_NUMBER_ID
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: survey-agent-web
    runtime: docker
    rootDir: frontend
    envVars:
      # Build-time rewrite target: the API service's public URL.
      - key: BACKEND_URL
        sync: false
