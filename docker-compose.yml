# Full stack locally or on a single VM:  cp .env.example .env && docker compose up --build
# Web app: http://localhost:3000   API: http://localhost:5000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U survey -d survey_agent"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://survey:survey@db:5432/survey_agent
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      # Plain http on localhost; set to true (the production default) behind HTTPS.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
